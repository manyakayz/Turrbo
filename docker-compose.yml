services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
      - ./artifacts:/app/artifacts
      - ./turbofan_rul_v4.keras:/app/turbofan_rul_v4.keras:ro
    environment:
      - TURBOFAN_CORS_ORIGINS=http://localhost:3000

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
