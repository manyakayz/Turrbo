[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "turbofan-rul"
version = "4.0.0"
description = "Bi-LSTM + MC Dropout Remaining Useful Life prediction for NASA C-MAPSS turbofan engines"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "tensorflow-cpu>=2.16",
    "joblib>=1.3",
]

[tool.setuptools.packages.find]
where = ["src"]
